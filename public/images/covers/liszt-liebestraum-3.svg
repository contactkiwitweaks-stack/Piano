<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgVelvet" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="45%" stop-color="#1f020a" />
      <stop offset="100%" stop-color="#0a0104" />
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#881337" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldRomantic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="80%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="roseGoldStaves" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fecdd3" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fecdd3" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Deep Romantic Nocturne Background -->
  <rect width="600" height="600" fill="url(#bgVelvet)" />

  <!-- Lyrical Dream Atmosphere Glow -->
  <circle cx="300" cy="240" r="220" fill="url(#moonGlow)" />

  <!-- Gentle Moon Crest & Stars -->
  <g fill="#fecdd3" opacity="0.65">
    <circle cx="120" cy="80" r="1.5" />
    <circle cx="180" cy="120" r="2" />
    <circle cx="260" cy="65" r="1.2" />
    <circle cx="350" cy="90" r="2.2" />
    <circle cx="460" cy="70" r="1.8" />
    <circle cx="510" cy="130" r="2.5" />
    <circle cx="100" cy="200" r="2" />
    <circle cx="520" cy="220" r="1.5" />
    <circle cx="430" cy="180" r="1.2" />
  </g>

  <!-- Soft Radiant Nocturne Moon -->
  <circle cx="300" cy="180" r="70" fill="#fecdd3" opacity="0.15" />
  <circle cx="300" cy="180" r="50" fill="#fff1f2" opacity="0.25" />

  <!-- Flowing Cantabile Melody Ribbons (Tenor Theme In Ab Major) -->
  <path d="M60,320 C180,240 220,380 340,300 C420,240 500,290 560,260" fill="none" stroke="url(#roseGoldStaves)" stroke-width="3" />
  <path d="M40,340 C160,260 240,400 360,320 C440,260 520,310 580,280" fill="none" stroke="url(#roseGoldStaves)" stroke-width="1.8" opacity="0.7" />
  <path d="M80,300 C200,220 200,360 320,280 C400,220 480,270 540,240" fill="none" stroke="url(#roseGoldStaves)" stroke-width="1.5" opacity="0.5" />

  <!-- Concert Grand Piano Silhouette & Resonating Soundboard Arpeggios -->
  <g transform="translate(185, 175) scale(0.78)">
    <!-- Grand Piano Rim -->
    <path d="M40,240 C30,170 60,60 160,50 C260,40 320,100 320,170 C320,240 280,250 260,250 L40,250 Z" fill="#120106" stroke="url(#goldRomantic)" stroke-width="3" />
    
    <!-- Harp Strings (Golden Arpeggios) -->
    <g stroke="url(#goldRomantic)" stroke-width="1.2" opacity="0.6">
      <line x1="80" y1="235" x2="160" y2="70" />
      <line x1="100" y1="235" x2="180" y2="72" />
      <line x1="120" y1="235" x2="200" y2="78" />
      <line x1="140" y1="235" x2="220" y2="88" />
      <line x1="160" y1="235" x2="240" y2="102" />
      <line x1="180" y1="235" x2="260" y2="120" />
      <line x1="200" y1="235" x2="280" y2="142" />
      <line x1="220" y1="235" x2="300" y2="168" />
    </g>

    <!-- Prop Stick & Open Lid Line -->
    <line x1="60" y1="180" x2="200" y2="10" stroke="#f43f5e" stroke-width="2.5" />
    <path d="M50,180 L220,5 L320,80" fill="none" stroke="url(#goldRomantic)" stroke-width="2.5" opacity="0.85" />
    
    <!-- Keyboard Bed Reflection -->
    <rect x="40" y="246" width="220" height="12" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="50" y="246" width="10" height="7" fill="#090103" />
    <rect x="65" y="246" width="10" height="7" fill="#090103" />
    <rect x="90" y="246" width="10" height="7" fill="#090103" />
    <rect x="105" y="246" width="10" height="7" fill="#090103" />
    <rect x="120" y="246" width="10" height="7" fill="#090103" />
    <rect x="145" y="246" width="10" height="7" fill="#090103" />
    <rect x="160" y="246" width="10" height="7" fill="#090103" />
    <rect x="185" y="246" width="10" height="7" fill="#090103" />
    <rect x="200" y="246" width="10" height="7" fill="#090103" />
    <rect x="215" y="246" width="10" height="7" fill="#090103" />
    <rect x="240" y="246" width="10" height="7" fill="#090103" />
  </g>

  <!-- Golden Starlight Sparks -->
  <g fill="#fef08a">
    <polygon points="300,105 303,115 315,118 303,121 300,131 297,121 285,118 297,115" />
    <polygon points="420,160 422,168 430,170 422,172 420,180 418,172 410,170 418,168" opacity="0.8" />
    <polygon points="170,220 172,227 180,229 172,231 170,238 168,231 160,229 168,227" opacity="0.8" />
  </g>

  <!-- Typography: Concert Urtext Aesthetic -->
  <text x="300" y="505" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-weight="900" font-size="33" fill="#ffffff" text-anchor="middle" letter-spacing="4">LIEBESTRAUM NO. 3</text>
  <text x="300" y="545" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="600" font-size="15" fill="#f43f5e" text-anchor="middle" letter-spacing="2">FRANZ LISZT • NOTTURNO III IN AB MAJOR</text>
</svg>
