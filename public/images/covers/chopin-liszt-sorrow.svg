<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgSorrow" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#31102b" />
      <stop offset="45%" stop-color="#190616" />
      <stop offset="100%" stop-color="#070106" />
    </radialGradient>
    <radialGradient id="tragicGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.4" />
      <stop offset="45%" stop-color="#881337" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#190616" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sorrowGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="vortexArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Midnight Ground -->
  <rect width="600" height="600" fill="url(#bgSorrow)" />
  <circle cx="300" cy="235" r="225" fill="url(#tragicGlow)" />

  <!-- The 7:40 Coda Vortex: Sweeping Dynamic Kinetic Waves -->
  <path d="M 40,360 C 140,200 220,440 360,260 C 440,160 520,340 580,220" fill="none" stroke="url(#vortexArc)" stroke-width="3.5" />
  <path d="M 20,280 C 160,390 280,160 420,350 C 490,440 550,250 590,320" fill="none" stroke="url(#vortexArc)" stroke-width="2" opacity="0.65" />
  <path d="M 60,190 C 180,120 320,290 460,170 C 510,130 550,200 580,180" fill="none" stroke="url(#vortexArc)" stroke-width="1.5" opacity="0.45" />

  <!-- Tragic Broken Heart / Angelic Wing Silhouette in Gold -->
  <g transform="translate(300, 220) scale(0.95)" opacity="0.9">
    <!-- Stylized Wing / Lyre Silhouette -->
    <path d="M 0,-100 C -45,-70 -90,0 -80,60 C -75,90 -50,110 -20,120 C 0,125 0,125 20,120 C 50,110 75,90 80,60 C 90,0 45,-70 0,-100 Z" fill="none" stroke="url(#sorrowGold)" stroke-width="3" />
    <!-- Golden Strings of the Lyre -->
    <line x1="0" y1="-90" x2="0" y2="115" stroke="#fef08a" stroke-width="1.8" opacity="0.8" />
    <line x1="-15" y1="-80" x2="-12" y2="110" stroke="#fef08a" stroke-width="1.4" opacity="0.6" />
    <line x1="15" y1="-80" x2="12" y2="110" stroke="#fef08a" stroke-width="1.4" opacity="0.6" />
    <line x1="-30" y1="-65" x2="-25" y2="100" stroke="#fef08a" stroke-width="1.2" opacity="0.45" />
    <line x1="30" y1="-65" x2="25" y2="100" stroke="#fef08a" stroke-width="1.2" opacity="0.45" />
  </g>

  <!-- Glowing Starlight & Overtone Particles -->
  <g fill="#fef08a">
    <circle cx="170" cy="150" r="2.5" opacity="0.8" />
    <circle cx="230" cy="110" r="2" opacity="0.75" />
    <circle cx="370" cy="115" r="2" opacity="0.75" />
    <circle cx="430" cy="160" r="2.8" opacity="0.85" />
    <circle cx="140" cy="340" r="2.2" opacity="0.7" />
    <circle cx="460" cy="330" r="2.5" opacity="0.7" />
  </g>

  <!-- Typography Plaque -->
  <rect x="50" y="440" width="500" height="110" rx="16" fill="#0d020c" fill-opacity="0.85" stroke="#e11d48" stroke-width="1.5" stroke-opacity="0.4" />
  <text x="300" y="480" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="900" font-size="30" fill="url(#sorrowGold)" letter-spacing="5">
    SORROW
  </text>
  <text x="300" y="506" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-style="italic" font-size="14" fill="#fda4af" letter-spacing="1.5">
    Frédéric Chopin &amp; Franz Liszt • Concert Rhapsody
  </text>
  <text x="300" y="532" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#f59e0b" letter-spacing="2">
    THE 7:40 PRESTO CON FUOCO ENERGY • 2,622 NOTES
  </text>
</svg>
