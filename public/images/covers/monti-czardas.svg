<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgCzardas" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="45%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#180404" />
    </radialGradient>
    <radialGradient id="fireGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="gypsyRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Deep Hungarian Crimson Ground -->
  <rect width="600" height="600" fill="url(#bgCzardas)" />
  <circle cx="300" cy="270" r="230" fill="url(#fireGlow)" />

  <!-- Rhapsodic Dynamic Arcs (Friss Energy & Lassú Rubato) -->
  <path d="M40,360 C160,220 220,440 360,280 C440,180 520,320 580,240" fill="none" stroke="url(#gypsyRibbon)" stroke-width="3.5" />
  <path d="M20,290 C140,380 280,180 400,340 C480,420 540,260 590,310" fill="none" stroke="url(#gypsyRibbon)" stroke-width="2" opacity="0.6" />

  <!-- Stylized Hungarian Violin & Cimbalom Silhouette -->
  <g transform="translate(300, 240) scale(0.9)" opacity="0.85">
    <!-- Violin Body Outline -->
    <path d="M -30,-90 C -60,-70 -70,-30 -45,0 C -75,30 -70,90 -25,120 C 0,135 0,135 25,120 C 70,90 75,30 45,0 C 70,-30 60,-70 30,-90 Z" fill="none" stroke="url(#goldFlame)" stroke-width="3" />
    <!-- F-Holes -->
    <path d="M -22,-30 C -28,-10 -15,10 -22,30" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />
    <path d="M 22,-30 C 28,-10 15,10 22,30" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />
    <!-- Bridge & Strings -->
    <line x1="0" y1="-120" x2="0" y2="130" stroke="#fef08a" stroke-width="1.5" opacity="0.7" />
    <line x1="-8" y1="-120" x2="-8" y2="130" stroke="#fef08a" stroke-width="1.2" opacity="0.5" />
    <line x1="8" y1="-120" x2="8" y2="130" stroke="#fef08a" stroke-width="1.2" opacity="0.5" />
  </g>

  <!-- Sparks & Staccato Accents -->
  <g fill="#fef08a">
    <circle cx="160" cy="180" r="2.5" opacity="0.8" />
    <circle cx="210" cy="130" r="1.8" opacity="0.7" />
    <circle cx="390" cy="140" r="2.2" opacity="0.7" />
    <circle cx="450" cy="190" r="3" opacity="0.85" />
    <circle cx="130" cy="380" r="2" opacity="0.6" />
    <circle cx="480" cy="370" r="2.5" opacity="0.75" />
  </g>

  <!-- Typography Plaque -->
  <rect x="50" y="440" width="500" height="110" rx="16" fill="#140303" fill-opacity="0.75" stroke="#ea580c" stroke-width="1.5" stroke-opacity="0.4" />
  <text x="300" y="482" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="900" font-size="28" fill="url(#goldFlame)" letter-spacing="4">
    CZARDAS
  </text>
  <text x="300" y="508" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-style="italic" font-size="14" fill="#fca5a5" letter-spacing="1.5">
    Vittorio Monti • 1904
  </text>
  <text x="300" y="532" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#fbbf24" letter-spacing="2">
    VIRTUOSO GYPSY RHAPSODY • 5,465 NOTES
  </text>
</svg>
